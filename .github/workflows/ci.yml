name: ci

on: [push, pull_request]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, sqlite3
      - name: Create a fresh Laravel app and add our code
        run: |
          composer create-project laravel/laravel app --no-interaction --prefer-dist
          cd app
          php artisan install:api --without-migration-prompt --no-interaction
          cp -r ../backend/. .
          # Register our TenancyServiceProvider (works for any Laravel version that has bootstrap/providers.php)
          php -r '$f = "bootstrap/providers.php"; $p = require $f; $p[] = "App\\Providers\\TenancyServiceProvider"; $p = array_unique($p); file_put_contents($f, "<?php\n\nreturn [\n" . implode("", array_map(fn ($c) => "    " . $c . "::class,\n", $p)) . "];\n");'
          cat bootstrap/providers.php
      - name: Migrate + seed demo data
        working-directory: app
        run: php artisan migrate:fresh --seed --seeder=DemoSeeder --force
      - name: Run tests
        working-directory: app
        run: php artisan test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Live-Demo: Flutter-Web mit Fake-Backend im Browser (GitHub Pages hat keinen PHP-Server)
      - name: Build web demo
        run: |
          flutter create . --platforms=web --project-name parking_mobile
          flutter build web --release --base-href /parking-saas/ --dart-define=DEMO=true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: mobile/build/web

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, mobile, frontend]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
